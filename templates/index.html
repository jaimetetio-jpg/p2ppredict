<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2Ppredict - Pro</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        Pi.init({ version: "2.0", sandbox: true });
    </script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b28;
            --border-color: #2a2e43;
            --text-color: #ffffff;
            --text-muted: #8c92ac;
            --accent: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 4px 4px 10px #090b12;
        }
        .input, select {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btn {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .market-item {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div>⚡ <b style="color: #38bdf8; font-size: 1.1rem;">P2Ppredict</b></div>
        <div style="color: #38bdf8; font-weight: bold;">@jaimetetio</div>
    </header>

    <!-- CREAR MERCADO -->
    <div class="card">
        <h3 style="margin-top: 0; color: #38bdf8;">➕ Crear Nuevo Mercado</h3>
        <input type="text" id="titulo" class="input" placeholder="¿Pregunta o predicción?">
        <select id="categoria" class="input">
            <option value="Crypto">Crypto</option>
            <option value="Pi Ecosystem">Ecosistema Pi</option>
        </select>
        <button class="btn" onclick="crearMercado()">Publicar en Supabase</button>
    </div>

    <!-- LISTA DE MERCADOS -->
    <div class="card">
        <h3 style="margin-top: 0; color: #38bdf8;">📋 Mercados Activos</h3>
        <div id="lista-mercados" style="color: var(--text-muted); font-size: 0.9rem;">Cargando datos...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uwrqtuxzyzduakqftvjx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cnF0dXh6eWNkdWFrcWZ0dmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDg5MjcsImV4cCI6MjEwNDUyNDkyN30.7r8AYXSYOml1Ub68INeXXZKTIrqXbCpD-V9oAvFldZU';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", () => {
            cargarMercados();
        });

        async function cargarMercados() {
            const contenedor = document.getElementById('lista-mercados');
            try {
                const { data, error } = await supabaseClient
                    .from('markets')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = 'No hay mercados todavía. ¡Crea el primero arriba!';
                    return;
                }

                contenedor.innerHTML = '';
                data.forEach(m => {
                    contenedor.innerHTML += `
                        <div class="market-item">
                            <b style="color: #fff; font-size: 0.95rem;">${m.title}</b><br>
                            <span style="color: #38bdf8; font-size: 0.8rem;">🏷️ ${m.category || 'General'}</span>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error:", err);
                contenedor.innerHTML = '<span style="color: #f87171;">Error al conectar con la base de datos.</span>';
            }
        }

        async function crearMercado() {
            const title = document.getElementById('titulo').value.trim();
            const category = document.getElementById('categoria').value;

            if (!title) {
                alert("Escribe una pregunta para el mercado.");
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('markets')
                    .insert([{ title, category, closing_time: 'Pronto' }]);

                if (error) throw error;

                alert("¡Mercado creado con éxito!");
                document.getElementById('titulo').value = '';
                cargarMercados();
            } catch (err) {
                console.error("Error al crear:", err);
                alert("Hubo un error al guardar en Supabase.");
            }
        }
    </script>
</body>
</html>
