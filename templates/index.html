<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2Ppredict - Clean Start</title>
</head>
<body style="font-family: sans-serif; background: #0f111a; color: white; padding: 20px; max-width: 480px; margin: auto;">
    <h2>⚡ P2Ppredict (Prueba Limpia)</h2>
    
    <div style="background: #181b28; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2a2e43;">
        <h3>➕ Crear Mercado</h3>
        <input type="text" id="titulo" placeholder="¿Pregunta del mercado?" style="width:100%; padding:8px; margin-bottom:8px; box-sizing:border-box;"><br>
        <input type="text" id="categoria" placeholder="Categoría (Ej. Crypto)" style="width:100%; padding:8px; margin-bottom:8px; box-sizing:border-box;"><br>
        <button onclick="crearMercado()" style="background:#2563eb; color:white; border:none; padding:10px; width:100%; border-radius:5px; font-weight:bold;">Guardar en Supabase</button>
    </div>

    <div style="background: #181b28; padding: 15px; border-radius: 10px; border: 1px solid #2a2e43;">
        <h3>📋 Mercados en Supabase</h3>
        <div id="lista-mercados">Conectando...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uwrqtuxzyzduakqftvjx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mHFXA-Y_5NQsN9UWbuigCg_ZmN2WuPi';

        document.addEventListener("DOMContentLoaded", cargarMercados);

        async function cargarMercados() {
            const contenedor = document.getElementById('lista-mercados');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/markets?select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                if (data.length === 0) {
                    contenedor.innerHTML = 'No hay mercados todavía. ¡Crea uno arriba!';
                    return;
                }
                contenedor.innerHTML = '';
                data.forEach(m => {
                    contenedor.innerHTML += `<div style="background:#0f111a; padding:8px; margin-bottom:5px; border-radius:5px;"><b>${m.title}</b> (${m.category})</div>`;
                });
            } catch (e) {
                contenedor.innerHTML = 'Error al conectar con la base de datos.';
            }
        }

        async function crearMercado() {
            const title = document.getElementById('titulo').value;
            const category = document.getElementById('categoria').value;
            if (!title) return alert("Escribe un título");

            const res = await fetch(`${SUPABASE_URL}/rest/v1/markets`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ title, category, closing_time: 'Pronto' })
            });

            if (res.ok) {
                alert("¡Creado con éxito!");
                document.getElementById('titulo').value = '';
                document.getElementById('categoria').value = '';
                cargarMercados();
            } else {
                alert("Error al guardar");
            }
        }
    </script>
</body>
</html>
